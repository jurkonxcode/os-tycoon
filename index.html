<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A14">
<title>OS Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* === RESET === */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* === THEME === */
:root {
  --bg: #0A0A14;
  --surface: rgba(26, 26, 46, 0.72);
  --surface-solid: #16162A;
  --border: rgba(255, 255, 255, 0.08);
  --border-hi: rgba(255, 255, 255, 0.14);
  --text: #F0F0F8;
  --text-dim: #8A8AA0;
  --text-mute: #5A5A70;
  --accent: #00E0FF;
  --accent-2: #B388FF;
  --success: #00E676;
  --warn: #FF5C7A;
  --gold: #FFC93C;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

/* === BASE === */
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  touch-action: manipulation;
  overflow-x: hidden;
  font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
}

/* Mesh gradient background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(0, 224, 255, 0.15), transparent 60%),
    radial-gradient(ellipse 70% 50% at 90% 20%, rgba(179, 136, 255, 0.12), transparent 60%),
    radial-gradient(ellipse 90% 70% at 50% 100%, rgba(0, 224, 255, 0.08), transparent 60%);
  pointer-events: none;
}

/* Noise texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: 0.03;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* === APP LAYOUT === */
.app {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px 110px;
  position: relative;
}

/* === HEADER === */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
  padding-top: 8px;
}
.brand-block { display: flex; flex-direction: column; gap: 4px; }
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #00E0FF 0%, #B388FF 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}
.date-row {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.02em;
}
.money-block { display: flex; align-items: center; gap: 10px; }
.money {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.02em;
  transition: color 400ms;
}
.money.up { color: var(--success); }
.money.down { color: var(--warn); }
.play-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
  transition: transform 120ms, background 200ms;
}
.play-btn:active { transform: scale(0.94); }

/* === CARDS === */
.card {
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.05) inset,
    0 20px 40px -20px rgba(0,0,0,0.5);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
}
.card-title {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-dim);
  margin-bottom: 16px;
}

/* === STATS === */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 16px;
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-mute);
  font-weight: 600;
}
.stat-value {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.stat-value.accent { color: var(--accent); }
.stat-value.success { color: var(--success); }
.stat-value.gold { color: var(--gold); }

/* === CHART === */
.chart-wrap {
  position: relative;
  height: 160px;
  margin: 0 -8px;
}
.chart-wrap.sm { height: 110px; }
.chart {
  width: 100%;
  height: 100%;
  display: block;
}
.chart-empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-mute);
  font-size: 13px;
  text-align: center;
  padding: 0 20px;
  font-family: var(--font-mono);
}

/* === BUTTONS === */
.btn {
  background: rgba(255,255,255,0.04);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: transform 120ms, background 200ms, border-color 200ms;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(135deg, #00E0FF 0%, #00A6C4 100%);
  color: #0A0A14;
  border: none;
  padding: 16px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.02em;
  box-shadow:
    0 8px 24px -8px rgba(0,224,255,0.5),
    0 1px 0 rgba(255,255,255,0.4) inset;
  position: relative;
  overflow: hidden;
}
.btn.primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: translateX(-100%);
  transition: transform 600ms;
}
.btn.primary:active::after { transform: translateX(100%); }
.btn.danger {
  background: linear-gradient(135deg, #FF5C7A 0%, #C43A55 100%);
  color: #fff;
  border: none;
}
.btn-row { display: flex; gap: 8px; }

/* === FEATURES === */
.feature-list { display: flex; flex-direction: column; gap: 8px; }
.era-header {
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin: 16px 0 8px;
}
.era-header:first-child { margin-top: 0; }
.feature-btn {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px;
  transition: transform 120ms, border-color 200ms, background 200ms;
  font-family: inherit;
  width: 100%;
}
.feature-btn:active:not(:disabled) { transform: scale(0.985); }
.feature-btn.available {
  border-color: rgba(0,224,255,0.4);
  background: rgba(0,224,255,0.04);
}
.feature-btn.locked { opacity: 0.28; cursor: not-allowed; }
.feature-btn.done {
  opacity: 0.7;
  border-color: rgba(0,230,118,0.3);
  background: rgba(0,230,118,0.03);
}
.feature-btn.researching { border-color: rgba(255,201,60,0.5); }
.feature-name {
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font-body);
}
.feature-cost {
  font-size: 10px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}
.feature-status {
  grid-row: 1 / 3;
  grid-column: 2;
  align-self: center;
  display: flex;
  align-items: center;
}

/* === PROGRESS === */
.progress {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 10px;
  position: relative;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #00E0FF, #B388FF);
  border-radius: 2px;
  transition: width 400ms cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  box-shadow: 0 0 12px rgba(0,224,255,0.6);
}
.progress-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  animation: shimmer 2s infinite;
}
@keyframes shimmer {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

/* === COMPETITORS === */
.comp-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.comp-row:last-child { border-bottom: none; }
.comp-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 12px currentColor;
}
.comp-name { flex: 1; font-size: 13px; font-weight: 500; }
.comp-share {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
}

/* === REVIEWS === */
.review {
  background: rgba(255,255,255,0.03);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  border-left: 3px solid var(--border);
  position: relative;
}
.review.good { border-left-color: var(--success); background: rgba(0,230,118,0.04); }
.review.mid { border-left-color: var(--gold); background: rgba(255,201,60,0.04); }
.review.bad { border-left-color: var(--warn); background: rgba(255,92,122,0.04); }
.review-stars {
  font-size: 12px;
  color: var(--gold);
  margin-bottom: 6px;
  letter-spacing: 2px;
}
.review-text { font-size: 13px; line-height: 1.5; color: var(--text); }
.review-source {
  font-size: 11px;
  color: var(--text-mute);
  margin-top: 8px;
  font-family: var(--font-mono);
}

/* === LOG === */
.log { display: flex; flex-direction: column; gap: 8px; }
.log-item {
  display: flex;
  gap: 10px;
  font-size: 12px;
  line-height: 1.4;
  align-items: flex-start;
}
.log-day {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-mute);
  min-width: 40px;
  padding-top: 2px;
  letter-spacing: 0.02em;
}
.log-info { color: var(--text); }
.log-success { color: var(--success); }
.log-warning { color: var(--warn); }
.log-event { color: var(--accent-2); }

/* === TABS === */
.tabs {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10, 10, 20, 0.75);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 10px 4px calc(10px + env(safe-area-inset-bottom));
  z-index: 50;
  max-width: 520px;
  margin: 0 auto;
}
.tab {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-mute);
  padding: 6px 4px;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: color 250ms;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  position: relative;
}
.tab.active { color: var(--accent); }
.tab.active::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 28px;
  height: 2px;
  background: var(--accent);
  border-radius: 0 0 2px 2px;
  box-shadow: 0 0 16px var(--accent);
}
.tab-icon { display: flex; align-items: center; justify-content: center; height: 20px; }
.tab.active .tab-icon { filter: drop-shadow(0 0 8px var(--accent)); }

/* === MODAL === */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 200ms;
}
.modal {
  background: var(--surface-solid);
  border: 1px solid var(--border-hi);
  border-radius: 24px;
  padding: 28px;
  max-width: 400px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 300ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8);
  position: relative;
}
.modal::before {
  content: '';
  position: absolute;
  top: 0; left: 20%; right: 20%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.modal h2 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}
.modal p {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 20px;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp {
  from { transform: translateY(24px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* === EMPTY === */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-mute);
  font-size: 13px;
  line-height: 1.6;
  font-family: var(--font-mono);
}
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
  margin: 18px 0;
}
.pill {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.pill.live {
  background: rgba(0,230,118,0.15);
  color: var(--success);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* === PRICE DISPLAY === */
.price-display {
  font-family: var(--font-mono);
  font-size: 44px;
  font-weight: 600;
  letter-spacing: -0.03em;
  text-align: center;
  margin: 16px 0;
  background: linear-gradient(135deg, #F0F0F8, #8A8AA0);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="tabs"></div>
<div id="modal"></div>

<script>

// ============================================================

const SAVE_KEY = 'os-tycoon-save-v3';

function defaultState() {
  const features = {};
  FEATURES.forEach(f => { features[f.id] = 'locked'; });
  features.cli = 'done';
  features.gui = 'available';
  features.fs = 'available';

  const competitors = {};
  Object.keys(COMPETITORS_INIT).forEach(k => {
    competitors[k] = { ...COMPETITORS_INIT[k], lastRelease: 0 };
  });

  return {
    money: 5000, day: 0, osScore: 5, osShare: 0, osPrice: 99,
    osVersion: '1.0', features, researching: null, releasedFeatures: ['cli'],
    history: [], log: [{ day:0, msg:'Selamat datang di OS Tycoon!', type:'info' }],
    running: true, triggeredWorld: [], triggeredRandom: [], competitors,
    engineers: 1, reputation: 50, equity: 100, salaryBonus: 0, piracy: 0,
    lastReviews: null, lastRevenue: 0, marketing: 0, gameOver: false,
    showModal: null, tab: 'dashboard', speed: 1, prevMoney: 5000,
  };
}

let state = loadState() || defaultState();

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (typeof s.day !== 'number') return null;
    s.showModal = null;
    return s;
  } catch(e) { return null; }
}
function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
}

function fmtMoney(n) {
  const sign = n < 0 ? '-' : '';
  const a = Math.abs(n);
  if (a >= 1e9) return sign + '$' + (a/1e9).toFixed(2) + 'B';
  if (a >= 1e6) return sign + '$' + (a/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return sign + '$' + (a/1e3).toFixed(1) + 'k';
  return sign + '$' + a.toFixed(0);
}
function fmtDate(day) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const year = 1995 + Math.floor(day/360);
  const mi = Math.floor((day%360)/30);
  const d = (day%30)+1;
  return d + ' ' + months[mi] + ' ' + year;
}
function bumpVersion(v) {
  const p = v.split('.');
  return p[0] + '.' + (Number(p[1]||0)+1);
}
function addLog(msg, type) {
  state.log.push({ day: state.day, msg, type: type||'info' });
  if (state.log.length > 60) state.log = state.log.slice(-60);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function startResearch(id) {
  if (state.researching) return;
  const f = FEATURES.find(x => x.id === id);
  if (!f || state.features[id] !== 'available') return;
  if (state.money < f.cost) { addLog('Uang tidak cukup untuk ' + f.name, 'warning'); render(); return; }
  state.money -= f.cost;
  state.researching = { id, daysLeft: f.days, total: f.days };
  state.features[id] = 'researching';
  addLog('Mulai R&D: ' + f.name, 'info');
  saveState(); render();
}

function releaseOS() {
  if (state.gameOver) return;
  const done = Object.keys(state.features).filter(id => state.features[id] === 'done');
  let score = 0;
  done.forEach(id => {
    const f = FEATURES.find(x => x.id === id);
    if (f) score += f.effect;
  });
  score = Math.round(score * (0.7 + state.reputation/200));
  state.osScore = score;
  state.releasedFeatures = done;
  state.osVersion = bumpVersion(state.osVersion);
  state.lastReviews = { version: state.osVersion, score, reviews: generateReviews(score) };
  addLog('Rilis OS v' + state.osVersion + ' — skor ' + score, 'success');
  state.tab = 'reviews';
  saveState(); render();
}

function generateReviews(score) {
  const stars = clamp(Math.round(score/20), 1, 5);
  let pool;
  if (stars >= 4) pool = REVIEW_TEMPLATES.high;
  else if (stars >= 3) pool = REVIEW_TEMPLATES.mid;
  else pool = REVIEW_TEMPLATES.low;
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  const count = 4 + Math.floor(Math.random()*3);
  const out = [];
  for (let i=0; i<count; i++) {
    const t = shuffled[i % shuffled.length];
    const v = Math.random() < 0.3 ? clamp(stars + (Math.random()<0.5?-1:1),1,5) : stars;
    out.push({ stars: v, text: t.text, src: t.src });
  }
  return out;
}

function setPrice(p) { state.osPrice = clamp(p, 20, 500); saveState(); render(); }

function runMarketing(cost) {
  if (state.money < cost) { addLog('Uang tidak cukup.', 'warning'); render(); return; }
  state.money -= cost;
  state.marketing += cost / 5000;
  state.reputation = Math.min(100, state.reputation + 2);
  addLog('Marketing dijalankan (-' + fmtMoney(cost) + ')', 'success');
  saveState(); render();
}

function hireEngineer() {
  const cost = 500 * state.engineers;
  if (state.money < cost) { addLog('Uang tidak cukup.', 'warning'); render(); return; }
  state.money -= cost;
  state.engineers++;
  addLog('Rekrut engineer. Total: ' + state.engineers, 'success');
  saveState(); render();
}

function tickDay() {
  if (state.gameOver) return;
  state.prevMoney = state.money;
  state.day++;

  if (state.day % 30 === 0) {
    state.money -= state.engineers * 300 + (state.salaryBonus||0);
  }

  if (state.researching) {
    state.researching.daysLeft--;
    if (state.researching.daysLeft <= 0) {
      const f = FEATURES.find(x => x.id === state.researching.id);
      state.features[f.id] = 'done';
      addLog('R&D selesai: ' + f.name, 'success');
      state.researching = null;
      FEATURES.forEach(x => {
        if (x.requires && x.requires.includes(f.id) && state.features[x.id] === 'locked') {
          if (x.requires.every(r => state.features[r] === 'done')) state.features[x.id] = 'available';
        }
      });
    }
  }

  let revenue = 0;
  if (state.releasedFeatures.length > 2) {
    const scoreFactor = state.osScore / 100;
    const priceFactor = 1.2 - (state.osPrice / 300);
    const repFactor = 0.5 + state.reputation / 100;
    const engineFactor = 1 + (state.engineers - 1) * 0.15;
    const piracyFactor = 1 - (state.piracy || 0);
    const base = scoreFactor * priceFactor * repFactor * engineFactor * piracyFactor;
    revenue = Math.max(0, Math.round(base * state.osPrice * 8));
    state.money += revenue;

    if (state.day % 7 === 0) {
      const target = clamp(state.osScore * 0.5 * (0.7 + state.reputation/200), 0, 60);
      const speed = 0.05 + state.marketing * 0.02;
      state.osShare += (target - state.osShare) * speed;
      state.osShare = clamp(state.osShare, 0, 70);
      state.marketing = Math.max(0, state.marketing - 0.05);
    }
  }
  state.lastRevenue = revenue;

  Object.keys(state.competitors).forEach(k => {
    const c = state.competitors[k];
    if (state.day - c.lastRelease >= c.interval) {
      c.lastRelease = state.day;
      c.score = Math.min(c.score + Math.round(c.growth * (2 + Math.random() * 3)), 200);
      if (Math.random() < 0.3) addLog('📢 ' + c.name + ' merilis OS baru!', 'warning');
    }
  });

  recalcMarketShare();

  WORLD_EVENTS.forEach((ev, i) => {
    if (state.day >= ev.day && !state.triggeredWorld.includes(i)) {
      state.triggeredWorld.push(i);
      addLog('📰 ' + ev.msg, ev.type);
    }
  });

  if (state.day > 30 && Math.random() < 0.008 && !state.showModal) {
    const available = RANDOM_EVENTS.filter(e => state.day >= e.minDay && !state.triggeredRandom.includes(e.id));
    if (available.length) {
      const ev = available[Math.floor(Math.random()*available.length)];
      state.triggeredRandom.push(ev.id);
      state.showModal = ev.id;
      state.running = false;
    }
  }

  const snap = { day: state.day, share: state.osShare, revenue };
  Object.keys(state.competitors).forEach(k => { snap[k] = state.competitors[k].share; });
  state.history.push(snap);
  if (state.history.length > 180) state.history = state.history.slice(-180);

  if (state.day >= 1800) {
    state.gameOver = true;
    state.running = false;
    addLog('Tahun 2000 tiba. Permainan berakhir.', 'success');
  }

  if (state.day % 5 === 0) saveState();
}

function recalcMarketShare() {
  const remaining = 100 - state.osShare;
  const weights = {};
  let total = 0;
  Object.keys(state.competitors).forEach(k => {
    weights[k] = state.competitors[k].score * (0.8 + Math.random()*0.2);
    total += weights[k];
  });
  Object.keys(state.competitors).forEach(k => {
    state.competitors[k].share = (weights[k] / total) * remaining;
  });
}

function resolveModal(i) {
  const ev = RANDOM_EVENTS.find(e => e.id === state.showModal);
  if (!ev) { state.showModal = null; render(); return; }
  const c = ev.choices[i];
  if (c && c.effect) c.effect(state);
  state.showModal = null;
  state.running = true;
  saveState(); render();
}

function toggleRunning() {
  if (state.gameOver) return;
  state.running = !state.running;
  saveState(); render();
}
function switchTab(t) { state.tab = t; render(); }
function resetGame() {
  if (!confirm('Hapus semua progress?')) return;
  localStorage.removeItem(SAVE_KEY);
  state = defaultState();
  saveState(); render();
}
function setSpeed(s) { state.speed = s; saveState(); render(); }

function renderMultiChart() {
  const data = state.history;
  if (data.length < 2) return '<div class="chart-empty">Rilis OS untuk melihat grafik</div>';

  const w = 340, h = 160, pad = 8;
  const series = [
    { key:'share', color:'#00E0FF', label:'Kamu', glow:true },
    ...Object.keys(state.competitors).map(k => ({
      key: k, color: state.competitors[k].color, label: state.competitors[k].name
    })),
  ];

  let max = 10;
  data.forEach(d => series.forEach(s => { if (d[s.key] > max) max = d[s.key]; }));

  let defs = '<defs>';
  let paths = '';

  // gradient fill for player
  defs += '<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#00E0FF" stop-opacity="0.4"/>'
    + '<stop offset="100%" stop-color="#00E0FF" stop-opacity="0"/>'
    + '</linearGradient>'
    + '<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  defs += '</defs>';

  // player area fill
  let playerPath = '';
  data.forEach((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad*2);
    const y = h - pad - (d.share / max) * (h - pad*2);
    playerPath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  });
  paths += '<path d="' + playerPath + 'L' + (w-pad) + ',' + (h-pad) + ' L' + pad + ',' + (h-pad) + ' Z" fill="url(#pg)"/>';

  series.forEach(s => {
    let path = '';
    data.forEach((d, i) => {
      const x = pad + (i / (data.length - 1)) * (w - pad*2);
      const y = h - pad - (d[s.key] / max) * (h - pad*2);
      path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    });
    const filter = s.glow ? ' filter="url(#glow)"' : '';
    const sw = s.glow ? 2.5 : 1.5;
    const op = s.glow ? 1 : 0.75;
    paths += '<path d="' + path + '" fill="none" stroke="' + s.color + '" stroke-width="' + sw + '" stroke-linejoin="round" stroke-linecap="round" opacity="' + op + '"' + filter + '/>';
  });

  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" class="chart">' + defs + paths + '</svg>';
}

function renderRevenueChart() {
  const data = state.history;
  if (data.length < 2) return '<div class="chart-empty">Belum ada revenue</div>';

  const w = 340, h = 110, pad = 8;
  const max = Math.max(100, ...data.map(d => d.revenue || 0));

  let path = '';
  data.forEach((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad*2);
    const y = h - pad - ((d.revenue || 0) / max) * (h - pad*2);
    path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  });

  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" class="chart">'
    + '<defs>'
    + '<linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#00E676" stop-opacity="0.5"/>'
    + '<stop offset="100%" stop-color="#00E676" stop-opacity="0"/>'
    + '</linearGradient>'
    + '<filter id="glowg"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    + '</defs>'
    + '<path d="' + path + 'L' + (w-pad) + ',' + (h-pad) + ' L' + pad + ',' + (h-pad) + ' Z" fill="url(#rg)"/>'
    + '<path d="' + path + '" fill="none" stroke="#00E676" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowg)"/>'
    + '</svg>';
}

function renderRnD() {
  let html = '<section class="card">'

    + '<div class="stat"><span class="stat-label">Engineer</span><span class="stat-value">' + state.engineers + '</span></div>'
    + '<div class="stat"><span class="stat-label">Gaji/bln</span><span class="stat-value">' + fmtMoney(state.engineers*300 + (state.salaryBonus||0)) + '</span></div>'
    + '<div class="stat"><span class="stat-label">Reputasi</span><span class="stat-value">' + Math.round(state.reputation) + '</span></div>'
    + '</div>'
    + '<div class="divider"></div>'
    + '<button class="btn" data-act="hire">' + ICON.plus + ' Rekrut Engineer ($' + (500*state.engineers) + ')</button>'
    + '</section>';

  if (state.researching) {
    const f = FEATURES.find(x => x.id === state.researching.id);
    const pct = (1 - state.researching.daysLeft / state.researching.total) * 100;
    html += '<section class="card">'
      + '<div class="card-title">Sedang Diteliti</div>'
      + '<div style="font-size:14px;font-weight:600;margin-bottom:4px">' + f.name + '</div>'
      + '<div class="progress"><div class="progress-bar" style="width:' + pct + '%"></div></div>'

      + '</section>';
  }

  const eras = {};
  FEATURES.forEach(f => { if (!eras[f.era]) eras[f.era] = []; eras[f.era].push(f); });

  html += '<section class="card"><div class="card-title">Tech Tree</div>';
  Object.keys(eras).sort().forEach(era => {
    html += '<div class="era-header">' + ERA_NAMES[era] + '</div><div class="feature-list">';
    eras[era].forEach(f => {
      const st = state.features[f.id];
      const dis = st !== 'available' ? 'disabled' : '';
      let icon = '';
      if (st === 'done') icon = ICON.check;
      else if (st === 'locked') icon = ICON.lock;
      else if (st === 'researching') icon = ICON.spinner;
      html += '<button class="feature-btn ' + st + '" ' + dis + ' data-act="research" data-id="' + f.id + '">'
        + '<div class="feature-name">' + f.name + '</div>'
        + '<div class="feature-cost">$' + f.cost + ' · ' + f.days + 'd · +' + f.effect + '</div>'
        + '<div class="feature-status">' + icon + '</div>'
        + '</button>';
    });
    html += '</div>';
  });
  html += '</section>';
  return html;
}

function renderMarket() {
  const comps = Object.keys(state.competitors).map(k => ({ ...state.competitors[k], key:k }));
  return ''
    + '<section class="card">'
    + '<div class="card-title">Pesaing</div>'
    + comps.map(c => '<div class="comp-row">'
        + '<span class="comp-dot" style="background:' + c.color + ';color:' + c.color + '"></span>'
        + '<span class="comp-name">' + c.name + '</span>'
        + '<span class="comp-share">' + c.share.toFixed(1) + '%</span>'
      + '</div>').join('')
    + '</section>'

    + '<section class="card">'
    + '<div class="card-title">Harga OS</div>'
    + '<div class="price-display">$' + state.osPrice + '</div>'
    + '<div class="btn-row">'
    + '<button class="btn" data-act="price-down">- $10</button>'
    + '<button class="btn" data-act="price-up">+ $10</button>'
    + '</div>'
    + '</section>'

    + '<section class="card">'
    + '<div class="card-title">Marketing</div>'
    + '<button class="btn" data-act="mkt-500" style="margin-bottom:8px">Iklan kecil · $500</button>'
    + '<button class="btn" data-act="mkt-2000" style="margin-bottom:8px">Kampanye · $2.000</button>'
    + '<button class="btn" data-act="mkt-5000">Blitz · $5.000</button>'
    + '</section>';
}

function renderReviews() {
  if (!state.lastReviews) {
    return '<div class="empty">Belum ada review.<br>Rilis OS pertamamu untuk melihat reaksi pasar.</div>';
  }
  const r = state.lastReviews;
  const s = clamp(Math.round(r.score/20),1,5);
  const stars = '★'.repeat(s) + '☆'.repeat(5 - s);
  return ''
    + '<section class="card">'
    + '<div class="card-title">Review v' + r.version + '</div>'
    + '<div style="font-size:28px;color:var(--gold);letter-spacing:4px;margin-bottom:4px">' + stars + '</div>'
    + '<div style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">Skor OS: ' + r.score + '</div>'
    + '</section>'
    + r.reviews.map(rv =>
        '<div class="review ' + (rv.stars>=4?'good':rv.stars>=3?'mid':'bad') + '">'
        + '<div class="review-stars">' + '★'.repeat(rv.stars) + '☆'.repeat(5-rv.stars) + '</div>'
        + '<div class="review-text">"' + esc(rv.text) + '"</div>'
        + '<div class="review-source">— ' + rv.src + '</div>'
        + '</div>'
      ).join('');
}

function renderSettings() {
  return ''
    + '<section class="card">'
    + '<div class="card-title">Statistik</div>'
    + '<div class="stats-grid">'
    + '<div class="stat"><span class="stat-label">Hari</span><span class="stat-value">' + state.day + '</span></div>'
    + '<div class="stat"><span class="stat-label">Equity</span><span class="stat-value">' + state.equity + '%</span></div>'
    + '<div class="stat"><span class="stat-label">Versi</span><span class="stat-value">v' + state.osVersion + '</span></div>'
    + '</div>'
    + '</section>'

    + '<section class="card">'
    + '<div class="card-title">Kecepatan</div>'
    + '<div class="btn-row">'
    + [1,2,4].map(s =>
        '<button class="btn' + (state.speed===s?' primary':'') + '" data-act="speed" data-s="' + s + '">' + s + '×</button>'
      ).join('')
    + '</div>'
    + '</section>'

    + '<section class="card">'
    + '<div class="card-title">Bahaya</div>'
    + '<button class="btn danger" data-act="reset">Reset Game</button>'
    + '</section>'

    + '<section class="card">'
    + '<div class="card-title">Tentang</div>'
    + '<div style="font-size:12px;color:var(--text-dim);line-height:1.6">OS Tycoon v0.3<br>1 file HTML · data di browser kamu</div>'
    + '</section>';
}

function renderTabs() {
  const tabs = [
    { id:'dashboard', label:'Home',    icon:ICON.home },
    { id:'rnd',       label:'R&D',     icon:ICON.rnd },
    { id:'market',    label:'Pasar',   icon:ICON.market },
    { id:'reviews',   label:'Review',  icon:ICON.review },
    { id:'settings',  label:'Setelan', icon:ICON.settings },
  ];
  return '<div class="tabs">'
    + tabs.map(t =>
        '<button class="tab' + (state.tab===t.id?' active':'') + '" data-act="tab" data-tab="' + t.id + '">'
        + '<span class="tab-icon">' + t.icon + '</span>'
        + '<span>' + t.label + '</span>'
        + '</button>'
      ).join('')
    + '</div>';
}

function renderModal() {
  if (!state.showModal) return '';
  const ev = RANDOM_EVENTS.find(e => e.id === state.showModal);
  if (!ev) return '';
  return '<div class="modal-overlay"><div class="modal">'
    + '<h2>' + ev.title + '</h2>'
    + '<p>' + ev.text + '</p>'
    + ev.choices.map((c, i) =>
        '<button class="btn' + (i===0?' primary':'') + '" data-act="modal" data-i="' + i + '" style="margin-bottom:8px">' + c.label + '</button>'
      ).join('')
    + '</div></div>';
}

function render() {
  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  const modal = document.getElementById('modal');

  let body = renderHeader();
  if (state.gameOver) {
    body += '<section class="card">'
      + '<div class="card-title">Permainan Selesai</div>'
      + '<div style="text-align:center;font-size:48px;margin:16px 0">🏆</div>'
      + '<div style="text-align:center;font-size:14px;line-height:1.8">'
      + 'Kamu mengakhiri tahun 2000 dengan:<br><br>'
      + '<strong style="color:var(--accent);font-size:26px;font-family:var(--font-mono)">' + state.osShare.toFixed(1) + '%</strong>'
      + '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em">pangsa pasar</div>'
      + '<br>'
      + '<strong style="color:var(--success);font-size:26px;font-family:var(--font-mono)">' + fmtMoney(state.money) + '</strong>'
      + '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em">total uang</div>'
      + '</div>'
      + '<div class="divider"></div>'
      + '<button class="btn primary" data-act="reset">Main Ulang</button>'
      + '</section>';
  } else {
    if (state.tab === 'dashboard') body += renderDashboard();
    else if (state.tab === 'rnd') body += renderRnD();
    else if (state.tab === 'market') body += renderMarket();
    else if (state.tab === 'reviews') body += renderReviews();
    else if (state.tab === 'settings') body += renderSettings();
  }

  app.innerHTML = body;
  tabs.innerHTML = state.gameOver ? '' : renderTabs();
  modal.innerHTML = renderModal();
}

// ============================================================
// === EVENTS ===
// ============================================================
document.body.addEventListener('click', function(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'toggle') toggleRunning();
  else if (act === 'release') releaseOS();
  else if (act === 'research') startResearch(el.dataset.id);
  else if (act === 'hire') hireEngineer();
  else if (act === 'price-down') setPrice(state.osPrice - 10);
  else if (act === 'price-up') setPrice(state.osPrice + 10);
  else if (act === 'mkt-500') runMarketing(500);
  else if (act === 'mkt-2000') runMarketing(2000);
  else if (act === 'mkt-5000') runMarketing(5000);
  else if (act === 'tab') switchTab(el.dataset.tab);
  else if (act === 'modal') resolveModal(Number(el.dataset.i));
  else if (act === 'reset') resetGame();
  else if (act === 'speed') setSpeed(Number(el.dataset.s));
});

// ============================================================
// === LOOP ===
// ============================================================
let lastTick = Date.now();
function loop() {
  if (state.running && !state.gameOver && !state.showModal) {
    const now = Date.now();
    const tickMs = 1000 / state.speed;
    if (now - lastTick >= tickMs) {
      const ticks = Math.min(Math.floor((now - lastTick) / tickMs), 30);
      for (let i = 0; i < ticks; i++) tickDay();
      lastTick = now;
      render();
    }
  } else {
    lastTick = Date.now();
  }
  requestAnimationFrame(loop);
}

render();
loop();
</script>
</body>
</html>
